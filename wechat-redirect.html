<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .redirect-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff;
        }

        .redirect-text {
            color: #333;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1890FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .back-button:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">返回</button>
    <div class="redirect-container">
        <div class="redirect-text">正在跳转至微信小程序……</div>
        <div class="loading-spinner"></div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'completion-page-responsive.html';
        }

        // 模拟跳转延迟
        setTimeout(function() {
            // 这里可以添加实际的微信小程序跳转代码
            console.log('跳转至微信小程序');
        }, 2000);
    </script>
</body>
</html>
