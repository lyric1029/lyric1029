<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独家课程</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 40px;
        }
        .back-button {
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>独家课程</h1>
        <button class="back-button" onclick="goBack()">返回</button>
    </div>
    <script>
        function goBack() {
            // 设置一个标记，表明已经打开过页面
            localStorage.setItem('hasOpenedPage', 'true');
            window.location.href = 'completion-page-responsive.html';
        }
    </script>
</body>
</html>
